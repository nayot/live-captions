[project]
name = "live-captions"
version = "0.1.0"
description = "Live English to Thai captions: Zoom caption API + second-screen display"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "websockets>=13",
]

[project.optional-dependencies]
google = [
    "google-cloud-speech>=2.26",
    "google-cloud-translate>=3.15",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
