<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Captions</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Second-screen display (double-click or F = full screen). Options: ?en=0 hides English, ?lines=3 Thai lines kept, ?size=1.2 scales text, ?align=left|center|right,
     ?prev=0 hides finished lines while a new one is spoken (lines then counts the live line too),
     ?bg=black|green|blue|<hex> background colour, ?fg=auto|white|yellow|black|<hex> Thai text colour, ?orig=0 shows only the translation (Thai for English speech,
     English for Thai speech), ?header=0 hides the top bar and label */
  :root { --grey:#4A4A4A; --gold:#FFCE00; --red:#7A1020; --scale:1; --align:center; --bg:#111; --fg:#fff; --fg-en:#9a9a9a; --fg-interim:#ddd; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family: Sarabun, "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
         display:flex; flex-direction:column; overflow:hidden; cursor:none; }
  .top { height:6px; background:var(--gold); flex:none; }
  .label { flex:none; display:flex; justify-content:space-between; align-items:center; padding:10px 3vw;
           font-size:calc(1.6vw * var(--scale)); color:var(--fg-en); }
  .label .live { background:var(--red); color:#fff; padding:2px 12px; border-radius:4px; font-weight:600; }
  .label .dot { display:inline-block; width:.6em; height:.6em; border-radius:50%; background:#666; margin-right:.4em; }
  .label .dot.on { background:#3c3; }
  #lines { flex:1; display:flex; flex-direction:column; justify-content:flex-end; padding:0 3vw 3vh; gap:2.2vh; text-align:var(--align); }
  .cap .en { font-size:calc(3.3vw * var(--scale));  /* Thai letters look larger than Latin at the same size; this makes English look ~70% of Thai */ color:var(--fg-en); line-height:1.3; }
  .cap .th { font-size:calc(4.2vw * var(--scale)); font-weight:600; line-height:1.35; }
  .cap.old { opacity:.45; }
  .cap.interim .th { color:var(--fg-interim); font-weight:400; }
  .cap.interim .en { color:var(--fg-en); opacity:.8; }
</style>
</head>
<body>
<div class="top"></div>
<div class="label">
  <span><span class="dot" id="dot"></span>คำบรรยายแปลภาษาไทยอัตโนมัติ · Automatic Thai captions</span>
  <span class="live">LIVE</span>
</div>
<div id="lines"></div>
<script>
const q = new URLSearchParams(location.search);
const showEn = q.get('en') !== '0';
const showOrig = q.get('orig') !== '0';
const showDraft = q.get('draft') === '1';  // default: only finished lines, never rewritten
const keep = Math.max(1, parseInt(q.get('lines') || '2', 10));
document.documentElement.style.setProperty('--scale', q.get('size') || '1');
const align = q.get('align');
if (['left', 'center', 'right'].includes(align)) document.documentElement.style.setProperty('--align', align);
const keepPrev = q.get('prev') !== '0';
if (q.get('header') === '0') document.querySelectorAll('.top, .label').forEach(el => el.style.display = 'none');
const BG = { black: '#111111', green: '#00b140', blue: '#0047bb' };
const bg = BG[q.get('bg')] || (/^[0-9a-f]{6}$/i.test(q.get('bg') || '') ? '#' + q.get('bg') : BG.black);
(function setColours(hex) {
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
  const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;       // light background -> dark text
  const css = document.documentElement.style;
  css.setProperty('--bg', hex);
  if (lum > 0.55) { css.setProperty('--fg', '#111'); css.setProperty('--fg-en', '#333'); css.setProperty('--fg-interim', '#333'); }
  else if (hex !== BG.black) { css.setProperty('--fg-en', '#f0f0f0'); css.setProperty('--fg-interim', '#f0f0f0'); }
})(bg);
const FG = { white: '#ffffff', yellow: '#ffe14d', black: '#111111' };
const fg = FG[q.get('fg')] || (/^[0-9a-f]{6}$/i.test(q.get('fg') || '') ? '#' + q.get('fg') : '');
if (fg) { document.documentElement.style.setProperty('--fg', fg); document.documentElement.style.setProperty('--fg-interim', fg); }
const lines = document.getElementById('lines');
const finals = [];          // {en, th}
let interim = null;         // {id, lang, src, tr}: what is being said now, and its draft translation

function cap(en, th, cls) {
  const d = document.createElement('div');
  d.className = 'cap ' + (cls || '');
  if (showEn && en) { const e = document.createElement('div'); e.className = 'en'; e.textContent = en; d.append(e); }
  const t = document.createElement('div'); t.className = 'th'; t.textContent = th || ''; d.append(t);
  return d;
}
function render() {
  lines.replaceChildren();
  // Show the line being spoken only once its large line has text (no "…" placeholder while translating);
  // until then the previous lines stay on screen.
  const big = !interim ? '' : !showOrig ? interim.tr : interim.lang === 'th' ? interim.src : interim.tr;
  const live = showDraft && big ? interim : null;
  const n = keepPrev ? keep : Math.max(0, keep - (live ? 1 : 0));
  (n ? finals.slice(-n) : []).forEach((f, i, a) => {
    const cls = i < a.length - 1 || live ? 'old' : '';
    lines.append(showOrig ? cap(f.en, f.th, cls) : cap('', f.tr || f.src, cls));  // no translation: show what was said
  });
  if (live) {                   // Thai always large, English small, whichever was spoken
    const en = live.lang === 'th' ? live.tr : live.src;
    lines.append(showOrig ? cap(en, big, 'interim') : cap('', big, 'interim'));
  }
}
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws/events`);
  ws.onopen = () => document.getElementById('dot').classList.add('on');
  ws.onmessage = m => {
    const d = JSON.parse(m.data);
    if (d.type === 'interim' || d.type === 'final_src') {
      const same = interim && interim.id === d.id && interim.lang === d.lang;
      interim = { id: d.id, lang: d.lang, src: d.src, tr: same ? interim.tr : '' };
    }
    else if (d.type === 'interim_tr') { if (interim && interim.id === d.id && interim.lang === d.lang) interim.tr = d.tr; }
    else if (d.type === 'final') { finals.push({ en: d.en, th: d.th, src: d.src, tr: d.tr }); if (finals.length > 20) finals.shift();
                                    if (interim && interim.id <= d.id) interim = null; }
    render();
  };
  ws.onclose = () => { document.getElementById('dot').classList.remove('on'); setTimeout(connect, 1500); };
  setInterval(() => ws.readyState === 1 && ws.send('ping'), 20000);
}
connect();

// Full screen: double-click or F (Esc leaves). Browsers require a user gesture, so it can't start on its own.
function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}
document.addEventListener('dblclick', toggleFull);
document.addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') toggleFull(); });
</script>
</body>
</html>
